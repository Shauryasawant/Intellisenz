[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "intellisenz"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "influxdb-client>=1.38",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9"
]

[project.optional-dependencies]
ml = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
